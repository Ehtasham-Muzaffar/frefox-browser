[package]
name = "ferrox"
version = "0.1.0"
edition = "2021"
authors = ["Ferrox Browser Project"]
description = "Ultra-lightweight, high-performance web browser for memory-constrained environments"
license = "MIT"
repository = "https://github.com/ferrox-browser/ferrox"

[[bin]]
name = "ferrox"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Ad blocking / URL filtering
regex = "1"
once_cell = "1"
aho-corasick = "1"

# Configuration
toml = "0.8"
dirs = "5"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# UUID for tab identifiers
uuid = { version = "1", features = ["v4"] }

# Filesystem / cache management
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# GTK4 UI toolkit
gtk4 = { version = "0.11", features = ["v4_12"] }
glib = "0.22"
gdk4 = "0.11"
gio = "0.22"
pango = "0.22"
# WebKitGTK4 web rendering engine
webkit6 = { version = "0.6", features = ["v2_42"] }

[target.'cfg(target_os = "windows")'.dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true

